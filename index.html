<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yash — Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Charcoal + sheen black palette */
      --bg-0:       #050507;
      --bg-1:       #0a0a0d;
      --bg-2:       #121216;
      --sheen:      rgba(255,255,255,0.85);
      --sheen-lo:   rgba(255,255,255,0.55);
      --hi:         #F4F4F6;
      --lo:         #8C8C95;
      --lo-dim:     #5A5A62;
      --line:       rgba(255,255,255,0.08);
      --line-hi:    rgba(255,255,255,0.28);

      --r:          22px;
      --r-sm:       12px;
      --blur:       blur(8px) saturate(120%);

      --fh:         'Archivo', system-ui, sans-serif;
      --fb:         'Space Grotesk', system-ui, sans-serif;
    }

    html { color-scheme: dark; scroll-behavior: smooth; }

    body {
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, #161618 0%, transparent 70%),
        linear-gradient(180deg, #08080a 0%, #050507 100%);
      color: var(--hi);
      font-family: var(--fb);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100svh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Shader canvas ──────────────────────────── */
    #bg {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }

    /* ── Page wrapper ───────────────────────────── */
    .page {
      position: relative; z-index: 1;
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 16px 80px;
    }

    /* ── Liquid Glass mixin ─────────────────────── */
    .lg {
      position: relative;
      isolation: isolate;
      background:
        linear-gradient(160deg,
          rgba(255,255,255,0.055) 0%,
          rgba(255,255,255,0.022) 60%,
          rgba(255,255,255,0.008) 100%);
      border: 1px solid var(--line);
      border-radius: var(--r);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.14),
        inset 0 -1px 0 rgba(0,0,0,0.35),
        inset 1px 0 0 rgba(255,255,255,0.03),
        inset -1px 0 0 rgba(255,255,255,0.03),
        0 8px 28px rgba(0,0,0,0.45),
        0 1px 0 rgba(0,0,0,0.6);
      overflow: hidden;
    }
    /* Diagonal sheen overlay (the "liquid" highlight) */
    .lg::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        linear-gradient(135deg,
          rgba(255,255,255,0.055) 0%,
          transparent 22%,
          transparent 72%,
          rgba(255,255,255,0.020) 100%);
      z-index: 0;
    }
    /* Soft inner glow top-left */
    .lg::after {
      content: '';
      position: absolute;
      top: -40%; left: -20%;
      width: 70%; height: 90%;
      background: radial-gradient(ellipse at center,
        rgba(255,255,255,0.025),
        transparent 65%);
      filter: blur(18px);
      pointer-events: none;
      z-index: 0;
    }
    .lg > * { position: relative; z-index: 1; }

    /* ── Profile card ───────────────────────────── */
    .profile {
      padding: 36px 24px 28px;
      text-align: center;
      margin-bottom: 20px;
    }

    .ava {
      width: 76px; height: 76px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3A3A40 0%, #08080A 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.22),
        inset 0 -2px 6px rgba(0,0,0,0.55),
        0 4px 18px rgba(0,0,0,0.7),
        0 0 0 1px rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--fh);
      font-size: 25px; font-weight: 700;
      color: #F4F4F6;
      margin: 0 auto 18px;
      letter-spacing: -.5px;
      user-select: none;
    }

    .p-name {
      font-family: var(--fh);
      font-size: clamp(20px, 5vw, 24px);
      font-weight: 700;
      letter-spacing: -.4px;
      margin-bottom: 4px;
      background: linear-gradient(180deg, #FFFFFF 0%, #B8B8C0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .p-role {
      font-size: 13px; font-weight: 500;
      color: var(--lo); margin-bottom: 12px;
    }

    .p-bio {
      font-size: 14px; color: var(--lo);
      line-height: 1.65;
      max-width: 340px;
      margin: 0 auto 22px;
    }

    .socials {
      display: flex; gap: 10px;
      justify-content: center;
    }

    .soc {
      width: 44px; height: 44px;
      border-radius: var(--r-sm);
      background:
        linear-gradient(180deg,
          rgba(255,255,255,0.06) 0%,
          rgba(255,255,255,0.02) 100%);
      border: 1px solid var(--line);
      color: var(--lo);
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        inset 0 -1px 0 rgba(0,0,0,0.25);
      transition: color 200ms ease, background 200ms ease, border-color 200ms ease, transform 200ms ease;
      cursor: pointer;
    }
    .soc:hover {
      background:
        linear-gradient(180deg,
          rgba(255,255,255,0.12) 0%,
          rgba(255,255,255,0.05) 100%);
      border-color: var(--line-hi);
      color: var(--hi);
    }
    .soc:focus-visible {
      outline: 2px solid var(--sheen);
      outline-offset: 2px;
    }
    .soc svg { width: 18px; height: 18px; fill: currentColor; }

    /* ── Section label ──────────────────────────── */
    .lbl {
      font-size: 11px; font-weight: 600;
      letter-spacing: .16em; text-transform: uppercase;
      color: var(--lo); margin-bottom: 12px;
    }

    /* ── Grid ───────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 540px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .card.main { grid-column: 1 / -1; }
    }

    /* ── Project card ───────────────────────────── */
    .card {
      padding: 18px;
      display: flex; flex-direction: column; gap: 10px;
      transition: border-color 280ms ease, transform 280ms ease, box-shadow 280ms ease;
    }
    .card:hover {
      border-color: var(--line-hi);
      transform: translateY(-3px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        inset 0 -1px 0 rgba(0,0,0,0.35),
        0 16px 44px rgba(0,0,0,0.55),
        0 1px 0 rgba(0,0,0,0.6);
    }

    .c-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 8px;
    }
    .c-name {
      font-family: var(--fh);
      font-size: 14px; font-weight: 600;
      line-height: 1.3; letter-spacing: -.1px;
      color: var(--hi);
    }
    .c-ico {
      color: rgba(255,255,255,.25);
      flex-shrink: 0; margin-top: 2px;
      transition: color 240ms ease;
    }
    .card:hover .c-ico { color: rgba(255,255,255,.55); }
    .c-ico svg {
      width: 13px; height: 13px;
      stroke: currentColor; fill: none;
      stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .c-desc {
      font-size: 13px; color: var(--lo);
      line-height: 1.55; flex: 1;
    }

    /* ── Tags ───────────────────────────────────── */
    .tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag {
      font-size: 10.5px; font-weight: 500;
      padding: 2px 8px; border-radius: 6px;
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.07);
      color: var(--lo);
      white-space: nowrap;
      letter-spacing: .02em;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }

    /* ── View link button ───────────────────────── */
    .vlink {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 500;
      color: var(--hi); text-decoration: none;
      padding: 7px 13px; border-radius: 9px;
      background:
        linear-gradient(180deg,
          rgba(255,255,255,0.10) 0%,
          rgba(255,255,255,0.03) 100%);
      border: 1px solid var(--line-hi);
      align-self: flex-start;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        inset 0 -1px 0 rgba(0,0,0,0.25);
      transition: background 200ms ease, border-color 200ms ease, transform 200ms ease;
      cursor: pointer;
      letter-spacing: .01em;
    }
    .vlink:hover {
      background:
        linear-gradient(180deg,
          rgba(255,255,255,0.18) 0%,
          rgba(255,255,255,0.06) 100%);
      border-color: rgba(255,255,255,0.42);
    }
    .vlink:focus-visible {
      outline: 2px solid var(--sheen);
      outline-offset: 2px;
    }
    .vlink svg {
      width: 11px; height: 11px;
      stroke: currentColor; fill: none;
      stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── Footer ─────────────────────────────────── */
    footer {
      margin-top: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 11px; letter-spacing: .04em;
      color: var(--lo-dim);
    }
    .lock {
      display: inline-flex;
      width: 22px; height: 22px;
      align-items: center; justify-content: center;
      border-radius: 6px;
      color: var(--lo-dim);
      text-decoration: none;
      transition: color 200ms, background 200ms;
    }
    .lock:hover {
      color: var(--hi);
      background: rgba(255,255,255,0.05);
    }
    .lock svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .footer-link {
      color: inherit;
      text-decoration: none;
      transition: color 200ms;
    }
    .footer-link:hover {
      color: var(--hi);
    }

    /* ── Reduced motion ─────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .card, .soc, .vlink, .c-ico { transition: none; }
      .card:hover { transform: none; }
    }
  </style>
</head>
<body>

  <canvas id="bg" aria-hidden="true"></canvas>

  <div class="page">

    <!-- ── Profile ───────────────────────────────── -->
    <section aria-label="Profile">
      <div class="lg profile">
        <div class="ava" id="ava" aria-hidden="true">YD</div>
        <h1 class="p-name" id="p-name">Yash Dev</h1>

        <p class="p-bio"   id="p-bio">Building things for the web — dev tooling, systems, and clean interfaces.</p>
        <nav class="socials" aria-label="Social profiles">

          <a id="soc-github" href="#" class="soc" aria-label="GitHub" target="_blank" rel="noopener noreferrer">

            </svg>
          </a>

        </nav>
      </div>
    </section>

    <!-- ── Projects ──────────────────────────────── -->
    <section aria-label="Projects">
      <p class="lbl" role="heading" aria-level="2">Projects</p>
      <div class="grid" id="grid"></div>
    </section>

    <footer>
      <span>Built with WebGL &middot; &copy; 2026 &middot; Created by <a href="https://github.com/Yash21116" target="_blank" rel="noopener noreferrer" class="footer-link">Yash</a></span>
      <a href="admin.html" class="lock" aria-label="Edit (admin)">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
      </a>
    </footer>
  </div>

  <script src="data.js"></script>
  <script>
    /* ── Render profile + projects from data ───────────── */
    (function () {
      const data = loadData();

      // Profile
      const avaEl = document.getElementById('ava');
      if (data.profile.image) {
        avaEl.innerHTML = `<img src="${escapeHtml(data.profile.image)}" alt="Profile" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
      } else {
        avaEl.textContent = data.profile.initials || '';
      }
      document.getElementById('p-name').textContent = data.profile.name || '';
      document.getElementById('p-role').textContent = data.profile.role || '';
      document.getElementById('p-bio').textContent  = data.profile.bio  || '';
      document.getElementById('soc-github').href    = data.profile.socials.github   || '#';
      document.getElementById('soc-linkedin').href  = data.profile.socials.linkedin || '#';
      document.getElementById('soc-twitter').href   = data.profile.socials.twitter  || '#';

      // Projects
      const grid = document.getElementById('grid');
      grid.innerHTML = data.projects.map((p) => `
        <article class="lg card ${(p.type || 'side') === 'main' ? 'main' : 'side'}">
          <div class="c-top">
            <h2 class="c-name">${escapeHtml(p.name)}</h2>
            <span class="c-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M7 17L17 7M7 7h10v10"/></svg>
            </span>
          </div>
          <p class="c-desc">${escapeHtml(p.desc)}</p>
          <div class="tags" aria-label="Tech stack">
            ${(p.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
          </div>
          <a href="${escapeHtml(p.link || '#')}" class="vlink" target="_blank" rel="noopener noreferrer" aria-label="View ${escapeHtml(p.name)}">
            View <svg viewBox="0 0 24 24"><path d="M7 17L17 7M7 7h10v10"/></svg>
          </a>
        </article>
      `).join('');
    })();
  </script>

  <script>
    /* ── Charcoal / sheen WebGL background ──────────────── */
    (function () {
      'use strict';
      const canvas = document.getElementById('bg');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) { canvas.style.display = 'none'; return; }

      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const VS = `
        attribute vec2 a;
        void main() { gl_Position = vec4(a, 0.0, 1.0); }
      `;

      const FS = `
        precision mediump float;
        uniform float u_t;
        uniform vec2  u_r;

        vec2 h2(vec2 p) {
          p = vec2(dot(p, vec2(127.1, 311.7)),
                   dot(p, vec2(269.5, 183.3)));
          return -1.0 + 2.0 * fract(sin(p) * 43758.5453);
        }

        float gn(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(dot(h2(i),            f),
                dot(h2(i+vec2(1,0)),  f-vec2(1,0)), u.x),
            mix(dot(h2(i+vec2(0,1)),  f-vec2(0,1)),
                dot(h2(i+vec2(1,1)),  f-vec2(1,1)), u.x),
            u.y);
        }

        float fbm(vec2 p) {
          float v = 0.0, a = 0.5;
          mat2 R = mat2(1.6, 1.2, -1.2, 1.6);
          for (int i = 0; i < 5; i++) {
            v += a * gn(p);
            p  = R * p;
            a *= 0.5;
          }
          return v;
        }

        void main() {
          vec2 uv = gl_FragCoord.xy / u_r;
          uv.x   *= u_r.x / u_r.y;

          float t = u_t * 0.57;

          vec2 q = vec2(fbm(uv + vec2(0.0, 0.0)),
                        fbm(uv + vec2(5.2, 1.3)));
          vec2 r = vec2(fbm(uv + 3.5*q + vec2(1.7,9.2) + 0.15*t),
                        fbm(uv + 3.5*q + vec2(8.3,2.8) + 0.13*t));

          float f = 0.5 + 0.5 * fbm(uv + 3.5*r);
          /* Bright linen: greys throughout, bright silver visible on peaks. */
          f = clamp(f * 1.2 - 0.18, 0.0, 1.0);

          vec3 deep    = vec3(0.003, 0.003, 0.006);
          vec3 dark1   = vec3(0.012, 0.012, 0.019);
          vec3 dark2   = vec3(0.028, 0.030, 0.042);
          vec3 dark3   = vec3(0.052, 0.058, 0.078);
          vec3 grey1   = vec3(0.095, 0.108, 0.148);
          vec3 grey2   = vec3(0.155, 0.172, 0.228);
          vec3 silver1 = vec3(0.720, 0.760, 0.880);
          vec3 silver2 = vec3(0.95, 0.98, 1.0);

          vec3 c = mix(deep,    dark1,   smoothstep(0.00, 0.12, f));
          c      = mix(c,       dark2,   smoothstep(0.10, 0.32, f));
          c      = mix(c,       dark3,   smoothstep(0.30, 0.48, f));
          c      = mix(c,       grey1,   smoothstep(0.42, 0.58, f));
          c      = mix(c,       grey2,   smoothstep(0.54, 0.70, f));
          c      = mix(c,       silver1, smoothstep(0.55, 0.72, f));
          c      = mix(c,       silver2, smoothstep(0.65, 0.85, f));
          c      = mix(c, silver2*0.50, pow(clamp(length(q),0.,1.),1.6)*0.28);

          /* Sparkle grain — subtle on dark linen */
          float sp1 = pow(max(0.0, gn(uv*58.0 + vec2( t*5.1, t*3.3))), 11.0);
          float sp2 = pow(max(0.0, gn(uv*40.0 + vec2(-t*3.8, t*5.7))), 13.0);
          float sp3 = pow(max(0.0, gn(uv*75.0 + vec2( t*2.4,-t*4.9))), 15.0);
          c += (sp1*0.60 + sp2*0.45 + sp3*0.30) * vec3(0.78, 0.84, 1.00);

          c.b *= 1.08; c.r *= 0.94;

          vec2 vc = gl_FragCoord.xy / u_r - 0.5;
          c *= 1.0 - dot(vc, vc) * 0.42;
          c *= 0.95;

          gl_FragColor = vec4(c, 1.0);
        }
      `;

      function mkShader(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
          console.warn('Shader error:', gl.getShaderInfoLog(s));
          return null;
        }
        return s;
      }

      const vs = mkShader(gl.VERTEX_SHADER,   VS);
      const fs = mkShader(gl.FRAGMENT_SHADER, FS);
      if (!vs || !fs) { canvas.style.display = 'none'; return; }

      const prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        canvas.style.display = 'none'; return;
      }
      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER,
        new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const aLoc = gl.getAttribLocation(prog, 'a');
      gl.enableVertexAttribArray(aLoc);
      gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

      const uT = gl.getUniformLocation(prog, 'u_t');
      const uR = gl.getUniformLocation(prog, 'u_r');

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width  = window.innerWidth  * dpr;
        canvas.height = window.innerHeight * dpr;
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform2f(uR, canvas.width, canvas.height);
      }
      window.addEventListener('resize', resize, { passive: true });
      resize();

      const t0 = performance.now();
      function draw() {
        gl.uniform1f(uT, reduced ? 2.0 : (performance.now() - t0) / 1000);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        if (!reduced) requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
</body>
</html>
