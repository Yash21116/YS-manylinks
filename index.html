<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yash — Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Universal Glass Scrollbar ──────────────────── */
    /* Webkit-based browsers (Chrome, Safari, Edge) */
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
      background: transparent !important;
    }
    html::-webkit-scrollbar-track, 
    html::-webkit-scrollbar-track-piece,
    html::-webkit-scrollbar-corner,
    html::-webkit-resizer,
    body::-webkit-scrollbar-track, 
    body::-webkit-scrollbar-track-piece,
    body::-webkit-scrollbar-corner,
    body::-webkit-resizer,
    ::-webkit-scrollbar-track, 
    ::-webkit-scrollbar-track-piece,
    ::-webkit-scrollbar-corner,
    ::-webkit-resizer {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }
    html::-webkit-scrollbar-thumb,
    body::-webkit-scrollbar-thumb,
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.5) !important;
      border: 1px solid rgba(255, 255, 255, 0.65) !important;
      border-radius: 9999px !important;
      box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.2) !important;
      background-clip: padding-box !important;
    }
    html::-webkit-scrollbar-thumb:hover,
    body::-webkit-scrollbar-thumb:hover,
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.75) !important;
      border-color: rgba(255, 255, 255, 0.9) !important;
    }
    html::-webkit-scrollbar-thumb:active,
    body::-webkit-scrollbar-thumb:active,
    ::-webkit-scrollbar-thumb:active {
      background: rgba(255, 255, 255, 0.95) !important;
      border-color: #ffffff !important;
    }
    /* Scrollbar buttons (arrows) */
    html::-webkit-scrollbar-button:single-button,
    body::-webkit-scrollbar-button:single-button,
    ::-webkit-scrollbar-button:single-button {
      background-color: rgba(255, 255, 255, 0.15) !important;
      display: block !important;
      background-repeat: no-repeat !important;
      background-size: 8px !important;
      background-position: center !important;
      border-radius: 4px !important;
      border: 1px solid rgba(255, 255, 255, 0.3) !important;
      width: 12px !important;
      height: 12px !important;
    }
    html::-webkit-scrollbar-button:single-button:hover,
    body::-webkit-scrollbar-button:single-button:hover,
    ::-webkit-scrollbar-button:single-button:hover {
      background-color: rgba(255, 255, 255, 0.3) !important;
      border-color: rgba(255, 255, 255, 0.5) !important;
    }
    html::-webkit-scrollbar-button:single-button:active,
    body::-webkit-scrollbar-button:single-button:active,
    ::-webkit-scrollbar-button:single-button:active {
      background-color: rgba(255, 255, 255, 0.5) !important;
      border-color: rgba(255, 255, 255, 0.7) !important;
    }

    /* Vertical Scrollbar Arrows */
    html::-webkit-scrollbar-button:single-button:vertical:decrement,
    body::-webkit-scrollbar-button:single-button:vertical:decrement,
    ::-webkit-scrollbar-button:single-button:vertical:decrement {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%23ffffff' stroke-width='16' stroke-linecap='round' stroke-linejoin='round'><polyline points='15,65 50,30 85,65'/></svg>") !important;
    }
    html::-webkit-scrollbar-button:single-button:vertical:increment,
    body::-webkit-scrollbar-button:single-button:vertical:increment,
    ::-webkit-scrollbar-button:single-button:vertical:increment {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%23ffffff' stroke-width='16' stroke-linecap='round' stroke-linejoin='round'><polyline points='15,35 50,70 85,35'/></svg>") !important;
    }

    /* Horizontal Scrollbar Arrows */
    html::-webkit-scrollbar-button:single-button:horizontal:decrement,
    body::-webkit-scrollbar-button:single-button:horizontal:decrement,
    ::-webkit-scrollbar-button:single-button:horizontal:decrement {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%23ffffff' stroke-width='16' stroke-linecap='round' stroke-linejoin='round'><polyline points='65,15 30,50 65,85'/></svg>") !important;
    }
    html::-webkit-scrollbar-button:single-button:horizontal:increment,
    body::-webkit-scrollbar-button:single-button:horizontal:increment,
    ::-webkit-scrollbar-button:single-button:horizontal:increment {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%23ffffff' stroke-width='16' stroke-linecap='round' stroke-linejoin='round'><polyline points='35,15 70,50 35,85'/></svg>") !important;
    }

    /* Firefox Fallback */
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.5) transparent;
    }

    :root {
      /* Charcoal + sheen black palette */
      --bg-0:       #050507;
      --bg-1:       #0a0a0d;
      --bg-2:       #121216;
      --sheen:      rgba(255,255,255,0.85);
      --sheen-lo:   rgba(255,255,255,0.55);
      --hi:         #F4F4F6;
      --lo:         #8C8C95;
      --lo-dim:     #5A5A62;
      --line:       rgba(255,255,255,0.08);
      --line-hi:    rgba(255,255,255,0.28);

      --r:          22px;
      --r-sm:       12px;
      --blur:       blur(8px) saturate(120%);

      --fh:         'Archivo', system-ui, sans-serif;
      --fb:         'Space Grotesk', system-ui, sans-serif;

      /* Glass card tokens */
      --glass-bg:       linear-gradient(160deg, rgba(255,255,255,0.055) 0%, rgba(255,255,255,0.022) 60%, rgba(255,255,255,0.008) 100%);
      --glass-border:   rgba(255,255,255,0.10);
      --glass-it:       rgba(255,255,255,0.14);
      --glass-ib:       rgba(0,0,0,0.35);
      --glass-shadow:   rgba(0,0,0,0.45);
      --glass-sheen1:   rgba(255,255,255,0.055);
      --glass-sheen2:   rgba(255,255,255,0.020);
      --glass-glow:     rgba(255,255,255,0.025);
      --ava-grad:       linear-gradient(135deg, #3A3A40 0%, #08080A 100%);
      --ava-color:      #F4F4F6;
      --name-grad:      linear-gradient(180deg, #FFFFFF 0%, #B8B8C0 100%);
      --soc-bg:         rgba(255,255,255,0.06);
      --soc-border:     rgba(255,255,255,0.12);
      --soc-hover:      rgba(255,255,255,0.12);
      --tag-bg:         rgba(255,255,255,0.045);
      --tag-border:     rgba(255,255,255,0.07);
      --tag-inset:      rgba(255,255,255,0.06);
      --vlink-bg:       linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%);
      --vlink-hover:    linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.06) 100%);
      --footer-color:   rgba(255,255,255,0.25);
    }

    /* ── Light mode overrides ───────────────────── */
    html[data-theme="light"] {
      color-scheme: light;
      --hi:           #0F172A;
      --lo:           #475569;
      --lo-dim:       #94A3B8;
      --line:         rgba(0,0,0,0.09);
      --line-hi:      rgba(0,0,0,0.22);
      --sheen:        rgba(0,0,0,0.70);
      --sheen-lo:     rgba(0,0,0,0.40);

      --glass-bg:     linear-gradient(160deg, rgba(0,0,0,0.055) 0%, rgba(0,0,0,0.022) 60%, rgba(0,0,0,0.008) 100%);
      --glass-border: rgba(0,0,0,0.10);
      --glass-it:     rgba(0,0,0,0.14);
      --glass-ib:     rgba(255,255,255,0.35);
      --glass-shadow: rgba(0,0,0,0.45);
      --glass-sheen1: rgba(0,0,0,0.055);
      --glass-sheen2: rgba(0,0,0,0.020);
      --glass-glow:   rgba(255,255,255,0.50);
      --ava-grad:     linear-gradient(135deg, #CBD5E1 0%, #E2E8F0 100%);
      --ava-color:    #1E293B;
      --name-grad:    linear-gradient(180deg, #0F172A 0%, #334155 100%);
      --soc-bg:       rgba(0,0,0,0.05);
      --soc-border:   rgba(0,0,0,0.10);
      --soc-hover:    rgba(0,0,0,0.09);
      --tag-bg:       rgba(0,0,0,0.04);
      --tag-border:   rgba(0,0,0,0.08);
      --tag-inset:    rgba(255,255,255,0.55);
      --vlink-bg:     linear-gradient(180deg, rgba(0,0,0,0.06) 0%, rgba(0,0,0,0.02) 100%);
      --vlink-hover:  linear-gradient(180deg, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0.04) 100%);
      --footer-color: rgba(0,0,0,0.35);
    }

    html {
      color-scheme: dark;
      background: transparent !important;
      overflow: hidden;
      height: 100%;
    }

    body {
      background: transparent !important;
      color: var(--hi);
      font-family: var(--fb);
      font-size: 16px;
      line-height: 1.6;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Shader canvas ──────────────────────────── */
    #bg {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, #161618 0%, transparent 70%),
        linear-gradient(180deg, #08080a 0%, #050507 100%) !important;
    }

    /* ── Page wrapper ───────────────────────────── */
    .page {
      position: relative; z-index: 1;
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 16px 80px;
    }

    /* ── Liquid Glass mixin ─────────────────────── */
    .lg {
      position: relative;
      isolation: isolate;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--r);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      box-shadow:
        inset 0 1px 0 var(--glass-it),
        inset 0 -1px 0 var(--glass-ib),
        inset 1px 0 0 rgba(255,255,255,0.03),
        inset -1px 0 0 rgba(255,255,255,0.03),
        0 8px 28px var(--glass-shadow),
        0 1px 0 rgba(0,0,0,0.6);
      overflow: hidden;
      transition: background 400ms ease, border-color 400ms ease, box-shadow 400ms ease;
    }
    /* Diagonal sheen overlay (the "liquid" highlight) */
    .lg::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        linear-gradient(135deg,
          var(--glass-sheen1) 0%,
          transparent 22%,
          transparent 72%,
          var(--glass-sheen2) 100%);
      z-index: 0;
    }
    /* Soft inner glow top-left */
    .lg::after {
      content: '';
      position: absolute;
      top: -40%; left: -20%;
      width: 70%; height: 90%;
      background: radial-gradient(ellipse at center,
        var(--glass-glow),
        transparent 65%);
      filter: blur(18px);
      pointer-events: none;
      z-index: 0;
    }
    .lg > * { position: relative; z-index: 1; }

    /* ── Profile card ───────────────────────────── */
    .profile {
      padding: 36px 24px 28px;
      text-align: center;
      margin-bottom: 20px;
    }

    .ava {
      width: 76px; height: 76px;
      border-radius: 50%;
      background: var(--ava-grad);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.22),
        inset 0 -2px 6px rgba(0,0,0,0.55),
        0 4px 18px rgba(0,0,0,0.7),
        0 0 0 1px rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--fh);
      font-size: 25px; font-weight: 700;
      color: var(--ava-color);
      margin: 0 auto 18px;
      letter-spacing: -.5px;
      user-select: none;
      transition: background 400ms ease, color 400ms ease;
    }

    .p-name {
      font-family: var(--fh);
      font-size: clamp(20px, 5vw, 24px);
      font-weight: 700;
      letter-spacing: -.4px;
      margin-bottom: 4px;
      background: var(--name-grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .p-role {
      font-size: 13px; font-weight: 500;
      color: var(--lo); margin-bottom: 12px;
    }

    .p-bio {
      font-size: 14px; color: var(--lo);
      line-height: 1.65;
      max-width: 340px;
      margin: 0 auto 22px;
    }

    .socials {
      display: flex; gap: 10px;
      justify-content: center;
    }

    .soc {
      width: 44px; height: 44px;
      border-radius: var(--r-sm);
      background: var(--soc-bg);
      border: 1px solid var(--line);
      color: var(--lo);
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        inset 0 -1px 0 rgba(0,0,0,0.25);
      transition: color 200ms ease, background 200ms ease, border-color 200ms ease, transform 200ms ease;
      cursor: pointer;
    }
    .soc:hover {
      background: var(--soc-hover);
      border-color: var(--line-hi);
      color: var(--hi);
    }
    .soc:focus-visible {
      outline: 2px solid var(--sheen);
      outline-offset: 2px;
    }
    .soc svg { width: 18px; height: 18px; fill: currentColor; }

    /* ── Section label ──────────────────────────── */
    .lbl {
      font-size: 11px; font-weight: 600;
      letter-spacing: .16em; text-transform: uppercase;
      color: var(--lo); margin-bottom: 12px;
    }

    /* ── Grid ───────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 540px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .card.main { grid-column: 1 / -1; }
    }

    /* ── Project card ───────────────────────────── */
    .card {
      padding: 18px;
      display: flex; flex-direction: column; gap: 10px;
      transition: border-color 280ms ease, transform 280ms ease, box-shadow 280ms ease;
    }
    .card:hover {
      border-color: var(--line-hi);
      transform: translateY(-3px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        inset 0 -1px 0 rgba(0,0,0,0.35),
        0 16px 44px rgba(0,0,0,0.55),
        0 1px 0 rgba(0,0,0,0.6);
    }

    .c-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 8px;
    }
    .c-name {
      font-family: var(--fh);
      font-size: 14px; font-weight: 600;
      line-height: 1.3; letter-spacing: -.1px;
      color: var(--hi);
    }
    .c-ico {
      color: rgba(255,255,255,.25);
      flex-shrink: 0; margin-top: 2px;
      transition: color 240ms ease;
    }
    .card:hover .c-ico { color: rgba(255,255,255,.55); }
    .c-ico svg {
      width: 13px; height: 13px;
      stroke: currentColor; fill: none;
      stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .c-desc {
      font-size: 13px; color: var(--lo);
      line-height: 1.55; flex: 1;
    }

    /* ── Tags ───────────────────────────────────── */
    .tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag {
      font-size: 10.5px; font-weight: 500;
      padding: 2px 8px; border-radius: 6px;
      background: var(--tag-bg);
      border: 1px solid var(--tag-border);
      color: var(--lo);
      white-space: nowrap;
      letter-spacing: .02em;
      box-shadow: inset 0 1px 0 var(--tag-inset);
    }

    /* ── View link button ───────────────────────── */
    .vlink {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 500;
      color: var(--hi); text-decoration: none;
      padding: 7px 13px; border-radius: 9px;
      background: var(--vlink-bg);
      border: 1px solid var(--line-hi);
      align-self: flex-start;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        inset 0 -1px 0 rgba(0,0,0,0.25);
      transition: background 200ms ease, border-color 200ms ease, transform 200ms ease;
      cursor: pointer;
      letter-spacing: .01em;
    }
    .vlink:hover {
      background: var(--vlink-hover);
      border-color: var(--line-hi);
    }
    .vlink:focus-visible {
      outline: 2px solid var(--sheen);
      outline-offset: 2px;
    }
    .vlink svg {
      width: 11px; height: 11px;
      stroke: currentColor; fill: none;
      stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── Footer ─────────────────────────────────── */
    footer {
      margin-top: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 11px; letter-spacing: .04em;
      color: var(--lo-dim);
    }
    .lock {
      display: inline-flex;
      width: 22px; height: 22px;
      align-items: center; justify-content: center;
      border-radius: 6px;
      color: var(--lo-dim);
      text-decoration: none;
      transition: color 200ms, background 200ms;
    }
    .lock:hover {
      color: var(--hi);
      background: rgba(255,255,255,0.05);
    }
    .lock svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .footer-link {
      color: inherit;
      text-decoration: none;
      transition: color 200ms;
    }
    .footer-link:hover {
      color: var(--hi);
    }

    /* ── Theme toggle button ────────────────────── */
    #theme-btn {
      position: fixed;
      z-index: 999;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid var(--line-hi);
      background: var(--glass-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      box-shadow:
        inset 0 1px 0 var(--glass-it),
        0 4px 16px var(--glass-shadow);
      cursor: grab;
      display: flex; align-items: center; justify-content: center;
      color: var(--lo);
      user-select: none;
      touch-action: none;
      transition: background 400ms ease, border-color 200ms ease,
                  color 200ms ease, box-shadow 200ms ease;
      left: 8px;
      top: calc(50vh - 22px);
    }
    #theme-btn:hover { color: var(--hi); border-color: var(--line-hi); }
    #theme-btn:active { cursor: grabbing; }
    #theme-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    #theme-btn .icon-moon { display: none; }
    html[data-theme="light"] #theme-btn .icon-sun  { display: none; }
    html[data-theme="light"] #theme-btn .icon-moon { display: block; }

    /* ── Reduced motion ─────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .card, .soc, .vlink, .c-ico { transition: none; }
      .card:hover { transform: none; }
    }
  </style>
</head>
<body>

  <canvas id="bg" aria-hidden="true"></canvas>

  <div class="page">

    <!-- ── Profile ───────────────────────────────── -->

      <div class="lg profile">

        <p class="p-role"  id="p-role">Full Stack Developer · Builder</p>
        <p class="p-bio"   id="p-bio">Building things for the web — dev tooling, systems, and clean interfaces.</p>
        <nav class="socials" aria-label="Social profiles">

          <a id="soc-github" href="#" class="soc" aria-label="GitHub" target="_blank" rel="noopener noreferrer">

            </svg>
          </a>

  <script src="data.js"></script>
  <script>
    /* ── Render profile + projects from data ───────────── */
    function renderData(data) {
      const avaEl = document.getElementById('ava');
      if (data.profile.image) {
        avaEl.innerHTML = `<img src="${escapeHtml(data.profile.image)}" alt="Profile" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
      } else {
        avaEl.textContent = data.profile.initials || '';
      }
      document.getElementById('p-name').textContent = data.profile.name || '';
      document.getElementById('p-role').textContent = data.profile.role || '';
      document.getElementById('p-bio').textContent  = data.profile.bio  || '';
      document.getElementById('soc-github').href    = data.profile.socials.github   || '#';
      document.getElementById('soc-linkedin').href  = data.profile.socials.linkedin || '#';
      document.getElementById('soc-twitter').href   = data.profile.socials.twitter  || '#';

      const grid = document.getElementById('grid');
      grid.innerHTML = data.projects.map((p) => `
        <article class="lg card ${(p.type || 'side') === 'main' ? 'main' : 'side'}">
          <div class="c-top">
            <h2 class="c-name">${escapeHtml(p.name)}</h2>
            <span class="c-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M7 17L17 7M7 7h10v10"/></svg>
            </span>
          </div>
          <p class="c-desc">${escapeHtml(p.desc)}</p>
          <div class="tags" aria-label="Tech stack">
            ${(p.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
          </div>
          <a href="${escapeHtml(p.link || '#')}" class="vlink" target="_blank" rel="noopener noreferrer" aria-label="View ${escapeHtml(p.name)}">
            View <svg viewBox="0 0 24 24"><path d="M7 17L17 7M7 7h10v10"/></svg>
          </a>
        </article>
      `).join('');
    }

    // Render immediately with local data (no blank flash)
    renderData(loadData());

    // Then fetch from Redis and update if different
    (async function () {
      try {
        const res = await fetch('/api/load-profile', { cache: 'no-store' });
        if (res.ok) {
          const remoteData = await res.json();
          if (remoteData && remoteData.profile && Array.isArray(remoteData.projects)) {
            renderData(remoteData);
          }
        }
      } catch (e) {
        // Already rendered local data above, nothing to do
      }
    })();
  </script>

  <script>
    /* ── Charcoal / sheen WebGL background ──────────────── */
    (function () {
      'use strict';
      const canvas = document.getElementById('bg');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) { canvas.style.display = 'none'; return; }

      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const VS = `
        attribute vec2 a;
        void main() { gl_Position = vec4(a, 0.0, 1.0); }
      `;

      const FS = `
        precision mediump float;
        uniform float u_t;
        uniform float u_mode;
        uniform vec2  u_r;

        vec2 h2(vec2 p) {
          p = vec2(dot(p, vec2(127.1, 311.7)),
                   dot(p, vec2(269.5, 183.3)));
          return -1.0 + 2.0 * fract(sin(p) * 43758.5453);
        }

        float gn(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(dot(h2(i),            f),
                dot(h2(i+vec2(1,0)),  f-vec2(1,0)), u.x),
            mix(dot(h2(i+vec2(0,1)),  f-vec2(0,1)),
                dot(h2(i+vec2(1,1)),  f-vec2(1,1)), u.x),
            u.y);
        }

        float fbm(vec2 p) {
          float v = 0.0, a = 0.5;
          mat2 R = mat2(1.6, 1.2, -1.2, 1.6);
          for (int i = 0; i < 5; i++) {
            v += a * gn(p);
            p  = R * p;
            a *= 0.5;
          }
          return v;
        }

        void main() {
          vec2 uv = gl_FragCoord.xy / u_r;
          uv.x   *= u_r.x / u_r.y;

          float t = u_t * 0.57;

          vec2 q = vec2(fbm(uv + vec2(0.0, 0.0)),
                        fbm(uv + vec2(5.2, 1.3)));
          vec2 r = vec2(fbm(uv + 3.5*q + vec2(1.7,9.2) + 0.15*t),
                        fbm(uv + 3.5*q + vec2(8.3,2.8) + 0.13*t));

          float f = 0.5 + 0.5 * fbm(uv + 3.5*r);
          /* Bright linen: greys throughout, bright silver visible on peaks. */
          f = clamp(f * 1.2 - 0.18, 0.0, 1.0);

          vec3 deep    = vec3(0.003, 0.003, 0.006);
          vec3 dark1   = vec3(0.012, 0.012, 0.019);
          vec3 dark2   = vec3(0.028, 0.030, 0.042);
          vec3 dark3   = vec3(0.052, 0.058, 0.078);
          vec3 grey1   = vec3(0.095, 0.108, 0.148);
          vec3 grey2   = vec3(0.155, 0.172, 0.228);
          vec3 silver1 = vec3(0.720, 0.760, 0.880);
          vec3 silver2 = vec3(0.95, 0.98, 1.0);

          vec3 c = mix(deep,    dark1,   smoothstep(0.00, 0.12, f));
          c      = mix(c,       dark2,   smoothstep(0.10, 0.32, f));
          c      = mix(c,       dark3,   smoothstep(0.30, 0.48, f));
          c      = mix(c,       grey1,   smoothstep(0.42, 0.58, f));
          c      = mix(c,       grey2,   smoothstep(0.54, 0.70, f));
          c      = mix(c,       silver1, smoothstep(0.55, 0.72, f));
          c      = mix(c,       silver2, smoothstep(0.65, 0.85, f));
          c      = mix(c, silver2*0.50, pow(clamp(length(q),0.,1.),1.6)*0.28);

          /* Light mode: invert the colour output */
          c = mix(c, 1.0 - c, u_mode);

          /* Sparkle — bright in dark, subtle dark flecks in light */
          float sp1 = pow(max(0.0, gn(uv*58.0 + vec2( t*5.1, t*3.3))), 11.0);
          float sp2 = pow(max(0.0, gn(uv*40.0 + vec2(-t*3.8, t*5.7))), 13.0);
          float sp3 = pow(max(0.0, gn(uv*75.0 + vec2( t*2.4,-t*4.9))), 15.0);
          float spVal = sp1*0.60 + sp2*0.45 + sp3*0.30;
          c += mix(spVal * vec3(0.78, 0.84, 1.00),
                  -spVal * 0.35 * vec3(0.90, 0.88, 0.85),
                   u_mode);

          /* Colour cast: bluish in dark, neutral-warm in light */
          c.b *= mix(1.08, 0.97, u_mode);
          c.r *= mix(0.94, 1.03, u_mode);

          /* Vignette: darken edges in dark, whiten edges in light */
          vec2 vc = gl_FragCoord.xy / u_r - 0.5;
          float vig = dot(vc, vc);
          c *= mix(1.0 - vig * 0.42, 1.0 + vig * 0.06, u_mode);
          c *= 0.95;

          gl_FragColor = vec4(c, 1.0);
        }
      `;

      function mkShader(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
          console.warn('Shader error:', gl.getShaderInfoLog(s));
          return null;
        }
        return s;
      }

      const vs = mkShader(gl.VERTEX_SHADER,   VS);
      const fs = mkShader(gl.FRAGMENT_SHADER, FS);
      if (!vs || !fs) { canvas.style.display = 'none'; return; }

      const prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        canvas.style.display = 'none'; return;
      }
      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER,
        new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const aLoc = gl.getAttribLocation(prog, 'a');
      gl.enableVertexAttribArray(aLoc);
      gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

      const uT    = gl.getUniformLocation(prog, 'u_t');
      const uR    = gl.getUniformLocation(prog, 'u_r');
      const uMode = gl.getUniformLocation(prog, 'u_mode');

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width  = window.innerWidth  * dpr;
        canvas.height = window.innerHeight * dpr;
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform2f(uR, canvas.width, canvas.height);
      }
      window.addEventListener('resize', resize, { passive: true });
      resize();

      /* ── Theme mode animation ──────────────────── */
      let shaderMode   = 0.0;   // current rendered value 0=dark 1=light
      let targetMode   = 0.0;
      let modeAnimStart = null;
      const MODE_DUR   = 500;   // ms

      window.__setShaderTarget = function(v) {
        targetMode = v;
        modeAnimStart = performance.now();
      };

      const t0 = performance.now();
      function draw() {
        const now = performance.now();
        /* Animate shaderMode toward targetMode */
        if (modeAnimStart !== null) {
          const p = Math.min((now - modeAnimStart) / MODE_DUR, 1);
          const e = p < 0.5 ? 2*p*p : 1 - 2*(1-p)*(1-p); // ease-in-out
          shaderMode = targetMode === 1 ? e : 1 - e;
          if (p >= 1) { shaderMode = targetMode; modeAnimStart = null; }
        }
        gl.uniform1f(uMode, shaderMode);
        gl.uniform1f(uT, reduced ? 2.0 : (now - t0) / 1000);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        if (!reduced) requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>

  <script>
    /* ── Theme toggle + perimeter drag ─────────────────── */
    (function () {
      const btn  = document.getElementById('theme-btn');
      const html = document.documentElement;
      const MARGIN = 8;

      /* ── Load saved theme ── */
      const saved = localStorage.getItem('theme') || 'dark';
      html.setAttribute('data-theme', saved);
      if (saved === 'light' && window.__setShaderTarget) window.__setShaderTarget(1);

      /* ── Toggle ── */
      function toggle() {
        const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        if (window.__setShaderTarget) window.__setShaderTarget(next === 'light' ? 1 : 0);
      }

      /* ── Perimeter position ── */
      // pos = { edge: 'left'|'right'|'top'|'bottom', t: 0..1 along that edge }
      let pos = JSON.parse(localStorage.getItem('themeBtnPos') || 'null')
                || { edge: 'left', t: 0.5 };

      function placeBtn(p) {
        const W  = window.innerWidth;
        const H  = window.innerHeight;
        const bw = btn.offsetWidth  || 44;
        const bh = btn.offsetHeight || 44;
        let x, y;
        switch (p.edge) {
          case 'top':    x = W * p.t - bw / 2; y = MARGIN;           break;
          case 'right':  x = W - bw - MARGIN;  y = H * p.t - bh / 2; break;
          case 'bottom': x = W * p.t - bw / 2; y = H - bh - MARGIN;  break;
          default:       x = MARGIN;            y = H * p.t - bh / 2; break; // left
        }
        btn.style.left = Math.max(MARGIN, Math.min(W - bw - MARGIN, x)) + 'px';
        btn.style.top  = Math.max(MARGIN, Math.min(H - bh - MARGIN, y)) + 'px';
      }

      /* Find nearest edge for a given mouse/touch point */
      function nearestEdge(mx, my) {
        const W = window.innerWidth, H = window.innerHeight;
        const dt = my,      dr = W - mx,
              db = H - my,  dl = mx;
        const m = Math.min(dt, dr, db, dl);
        if (m === dt) return { edge: 'top',    t: mx / W };
        if (m === dr) return { edge: 'right',  t: my / H };
        if (m === db) return { edge: 'bottom', t: mx / W };
        return             { edge: 'left',   t: my / H };
      }

      /* ── Drag state ── */
      let dragging = false, moved = false, sx = 0, sy = 0;

      btn.addEventListener('mousedown',  startDrag);
      btn.addEventListener('touchstart', startDrag, { passive: false });
      document.addEventListener('mousemove',  onDrag);
      document.addEventListener('touchmove',  onDrag,  { passive: false });
      document.addEventListener('mouseup',    endDrag);
      document.addEventListener('touchend',   endDrag);

      let lastX = 0, lastY = 0;

      function startDrag(e) {
        dragging = true; moved = false;
        const pt = e.touches ? e.touches[0] : e;
        sx = pt.clientX; sy = pt.clientY;
        lastX = pt.clientX; lastY = pt.clientY;
        btn.style.transition = 'background 400ms ease, border-color 200ms, color 200ms';
        e.preventDefault();
      }

      function onDrag(e) {
        if (!dragging) return;
        const pt = e.touches ? e.touches[0] : e;
        lastX = pt.clientX; lastY = pt.clientY;
        if (!moved && Math.hypot(pt.clientX - sx, pt.clientY - sy) > 6) moved = true;
        if (moved) {
          const bw = btn.offsetWidth, bh = btn.offsetHeight;
          btn.style.left = (pt.clientX - bw / 2) + 'px';
          btn.style.top  = (pt.clientY - bh / 2) + 'px';
        }
        e.preventDefault();
      }

      function endDrag() {
        if (!dragging) return;
        dragging = false;
        if (!moved) {
          toggle();
        } else {
          btn.style.transition = 'left 250ms cubic-bezier(.22,.68,0,1.2), top 250ms cubic-bezier(.22,.68,0,1.2), background 400ms ease, border-color 200ms';
          pos = nearestEdge(lastX, lastY);
          placeBtn(pos);
          localStorage.setItem('themeBtnPos', JSON.stringify(pos));
        }
      }

      window.addEventListener('resize', () => placeBtn(pos), { passive: true });
      /* Place after fonts/layout settle */
      requestAnimationFrame(() => placeBtn(pos));
    })();
  </script>
